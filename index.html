<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ClevelandRP player</title>
<!--
Cleveland RP loading screen video player. The Cleveland RP loading screen embeds this page and sends it the playlist
(YouTube video ids) and next / previous / mute commands; it answers with what is playing. It lives on an https site
because YouTube won't play inside FiveM's own loading screen page (no referrer). Nothing secret in here.
-->
<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080808;
}

/* The player is blown up past the edges so YouTube's title bar and logo sit off screen */
#yt {
    position: absolute;
    left: 50%;
    top: 50%;
    width: calc(max(100vw, 177.78vh) * 1.18);
    height: calc(max(56.25vw, 100vh) * 1.18);
    transform: translate(-50%, -50%);
    border: 0;
    pointer-events: none;
}

/* Black cover that fades between videos, so a change is never a cut, a buffer wheel or an end screen */
#fade {
    position: fixed;
    inset: 0;
    background: #080808;
    opacity: 1;
    transition: opacity 0.7s ease;
    pointer-events: none;
}

#fade.clear {
    opacity: 0;
}
</style>
</head>
<body>
<div id="yt"></div>
<div id="fade"></div>

<script>
const fade = document.getElementById('fade');

let tracks = [];
let order = [];
let pos = 0;
let endEarly = 1.5;
let volume = 55;
let muted = false;
let player = null;
let current = null;   // the track on screen
let shown = false;    // it has started playing and the black cover is lifted
let switching = false;
let loadTimer = null;
let failed = false;

function tell(msg) {
    window.parent.postMessage(Object.assign({ crpPlayer: true }, msg), '*');
}

// what the player is doing, for the loading screen's crpPlayerLog (diagnosis only)
function log(text) {
    tell({ type: 'log', text: text });
}

function shuffle(list) {
    for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = list[i]; list[i] = list[j]; list[j] = t;
    }
    return list;
}

function fail() {
    if (failed) return;
    log('failed: nothing left to play');
    failed = true;
    clearTimeout(loadTimer);
    if (player && player.stopVideo) player.stopVideo();
    tell({ type: 'failed' });
}

// next / previous playable track; a full pass reshuffles and never repeats the last video first
function step(dir) {
    if (!tracks.some(function (t) { return !t.broken; })) return null;
    for (let tries = 0; tries < order.length * 2; tries++) {
        pos += dir;
        if (pos >= order.length) {
            const last = order[order.length - 1];
            order = shuffle(order);
            if (order.length > 1 && order[0] === last) order.push(order.shift());
            pos = 0;
        } else if (pos < 0) {
            pos = order.length - 1;
        }
        if (!tracks[order[pos]].broken) return tracks[order[pos]];
    }
    return null;
}

let noStarts = 0;   // videos in a row that never started; 3 = YouTube isn't working here, give up

function watchStart(track) {
    clearTimeout(loadTimer);
    // a video that doesn't start in 30 s (the game is busy loading, slow connection) is skipped, not blacklisted
    loadTimer = setTimeout(function () {
        if (current !== track || shown) return;
        noStarts++;
        log('no start in 30s ' + track.id + ' (' + noStarts + ' in a row)');
        if (noStarts >= 3) fail(); else playTrack(step(1));
    }, 30000);
}

function playTrack(track) {
    if (!track) { fail(); return; }
    switching = true;
    shown = false;
    current = track;
    fade.classList.remove('clear');
    tell({ type: 'changing' });
    setTimeout(function () {
        if (current !== track) return;   // skipped again during the fade
        player.loadVideoById({ videoId: track.id, startSeconds: track.start || 0, endSeconds: track.end || undefined });
        if (muted) player.mute(); else player.unMute();
        player.setVolume(volume);
        switching = false;
    }, 700);
    watchStart(track);
}

function onState(e) {
    log('state ' + e.data + ' ' + (current && current.id));
    if (e.data === YT.PlayerState.PLAYING && !switching && current && !shown) {
        shown = true;
        noStarts = 0;
        clearTimeout(loadTimer);
        fade.classList.add('clear');
        const data = player.getVideoData ? player.getVideoData() : null;
        tell({ type: 'playing', title: (data && data.title) || '' });
    } else if (e.data === YT.PlayerState.ENDED && !switching) {
        playTrack(tracks.length === 1 ? current : step(1));
    }
}

function onError(e) {
    log('error ' + e.data + ' ' + (current && current.id));
    if (switching || !current) return;
    current.broken = true;
    playTrack(step(1));
}

// Move on just before the real end, so YouTube's end screen never shows
setInterval(function () {
    if (!player || !shown || switching || !current || !player.getDuration) return;
    const duration = player.getDuration();
    if (!duration) return;
    if (player.getCurrentTime() >= (current.end || duration) - endEarly) {
        playTrack(tracks.length === 1 ? current : step(1));
    }
}, 250);

function start() {
    order = shuffle(tracks.map(function (_, i) { return i; }));
    pos = 0;
    const first = tracks[order[0]];
    current = first;
    player = new YT.Player('yt', {
        videoId: first.id,
        playerVars: {
            autoplay: 1, controls: 0, disablekb: 1, fs: 0, rel: 0, iv_load_policy: 3,
            modestbranding: 1, playsinline: 1, cc_load_policy: 0, start: first.start || 0,
            end: first.end || undefined, mute: muted ? 1 : 0,
        },
        events: {
            onReady: function () {
                player.setVolume(volume);
                if (muted) player.mute(); else player.unMute();
                player.playVideo();
                watchStart(first);
            },
            onStateChange: onState,
            onError: onError,
        },
    });
}

let apiReady = false;
let config = null;
window.onYouTubeIframeAPIReady = function () {
    apiReady = true;
    if (config) start();
};

window.addEventListener('message', function (e) {
    const d = e.data || {};
    if (e.source !== window.parent || !d.crpLoadscreen) return;
    if (d.type === 'playlist' && !config) {
        config = d;
        tracks = (Array.isArray(d.tracks) ? d.tracks : []).filter(function (t) {
            return t && /^[A-Za-z0-9_-]{11}$/.test(t.id);
        }).map(function (t) { return { id: t.id, start: +t.start || 0, end: +t.end || 0, broken: false }; });
        endEarly = +d.endEarly || 1.5;
        volume = Math.min(Math.max(+d.volume || 55, 0), 100);
        muted = !!d.muted;
        if (tracks.length === 0) { fail(); return; }
        if (apiReady) start();
    } else if (!player || failed) {
        return;
    } else if (d.type === 'next' && tracks.length > 1) {
        playTrack(step(1));
    } else if (d.type === 'prev' && tracks.length > 1) {
        playTrack(step(-1));
    } else if (d.type === 'mute') {
        muted = !!d.muted;
        if (muted) player.mute(); else { player.unMute(); player.setVolume(volume); }
    }
});

const api = document.createElement('script');
api.src = 'https://www.youtube.com/iframe_api';
api.onerror = fail;
document.head.appendChild(api);
setTimeout(function () { if (!apiReady) fail(); }, 10000);

tell({ type: 'ready' });
</script>
</body>
</html>
